title = "Alpaca Benro Polaris Driver (Telescope)"

[network]
polaris_auto_retry = true                   # On connection failure, true=Continuously retry opening connection OR false=Use Alpaca Pilot to initiate reconnection, 
polaris_ip_address = '192.168.0.1'          # IP Address of the Benro Polaris on its WiFi Hotspot network.
polaris_port = 9090                         # Port the Benro Polaris is listening on.
polaris_wifi_password = ''                  # WPA2 password for the Polaris hotspot, used when the driver joins the host OS to it (Windows only). Leave blank -- the Polaris hotspot is always open in practice; kept for forward-compatibility.
enable_restapi = true                       # Provide the Alpaca REST API Service (do not turn off).
enable_socket = true                        # Provide the Alpaca Pilot SocketIO Service.
enable_discovery = true                     # Provide the Alpaca Discovery Service.
enable_mdns = true                          # Provide the mDNS Discovery Service for http://mdns_name.local.
mdns_name = 'ap.local'                      # Name advertised on mDNS (will always have a .local postfix)
enable_pilot = true                         # Provide the Alpaca Pilot Web Service.
enable_synscan = true                       # Provide the SynSCAN/Stellarium API Service.
enable_rest_https = false                   # Serve Alpaca REST-API over HTTPS (requires Nina>Options>Equipment>ASCOM Alpaca Disover>Use HTTPS - On).
enable_https = false                        # Serve Alpaca Pilot WebServer/WebSockets over HTTPS/WSS, with self-signed certificate.
alpaca_pilot_https_port = 443               # HTTPS port for the SPA when enable_https = true
alpaca_pilot_http_port  = 80                # HTTP port for the SPA when enable_https = false
alpaca_restapi_port = 5555                  # Port to expose Alpaca REST API Service on.
alpaca_socket_port = 5556                   # Port to expose Alpaca Pilot SocketIO Service on.
alpaca_discovery_port = 32227               # Port to expose Alpaca Discovery Service on.
stellarium_synscan_port = 10001             # Port to expose the Stellarium/SynSCAN Telescope Control Service on.
stellarium_synscan_ip_address = ''          # IP Address to expose this StellariumSynSCAN Service on. Loopback='127.0.0.1', Any Address=''.
alpaca_restapi_ip_address = ''              # IP Address to expose this Alpaca REST API Service on. Loopback='127.0.0.1', Any Address=''.
preset_action = ''                          # Action to trigger preset "<verb>_<type>", where <verb>="save" | "load" | "delete" and <type>="loc" | "pano"; auto-resets to ""
preset_name = ''                            # name of the preset to take action on

[server]
location_list   = ''                        # pipe-separated sorted list of saved location names, for Pilot locations dropdown
location = 'Sydney Observatory, Australia'  # Anything you want here. The site_lat/lon/ele are used in conversions between ra/dec and alt/az.
site_latitude = -33.8598874                 # The geodetic(map) latitude (degrees, positive North, WGS84) of the site at which the telescope is located.
site_longitude = 151.2021771                # The longitude (degrees, positive East, WGS84) of the site at which the telescope is located.
site_elevation = 39                         # The elevation above mean sea level (meters) of the site at which the telescope is located.
site_pressure = 1010                        # atmospheric pressure in milli Bars. Used to calculate atmospheric refraction. Default is standard atmosphere model used in aviation. A Value of 0 turns it off.
focal_length = 800                          # The telescope's focal length, in miliimeters.
focal_ratio = 11.0                          # The telescope's focal ratio ie focal_length / aperture_diameter.
verbose_driver_exceptions = true            # Provide more detailed description of any Exceptions encountered in the driver.
default_azimuth = '180'                     # String 'deg:mm:ss' used by Alpaca Pilot as default azimuth on Compass and Single Star Align 
default_altitude = '45'                     # String 'deg:mm:ss' used by Alpaca Pilot as default altitude on Single Star Align

[panorama]
pano_list = ''                              # pipe-separated sorted list of saved panorama presets, for Pilot panos dropdown
pano_name = ''                              # Name of the panorama defined below
sensor_size = 'Full Frame (36 × 24 mm)'     # Sensor size in mm. Only used in Panel Spacing Calculator. 
panel_overlap = '30%'                       # Overlap betwen adjacent panels. Only used in Panel Spacing Calculator. 
show_panels = false                         # Show Panorama Grid Panel Navigation on Main Dashboard  
cols = 3                                    # Number of panels across the mosaic. Range: 2–14
rows = 1                                    # Number of panels vertically. Range: 1–3
hstep = 40.0                                # Angular distance, in decimal degrees, between the centers of adjacent panels, horizontally.
vstep = 25.0                                # Angular distance, in decimal degrees, between the centers of adjacent panels, vertically.
first = 0                                   # Defines which corner is assigned panel number one: 0=TopLeft, 1=TopRight, 2=BottomLeft, 3=BottomRight 
order = 0                                   # Defines the sequence in which panels are captured: 0=Column-Major, 1=Row-Major, 2=Serpentine
track = 0                                   # Defines how the mount sets roll and tracking after moving to each panel: 0=Foreground/notracking, 1=Horizon-Locked/tracked&zero-roll, 2=Celestrial/tracked
anchor = 0                                  # Which part of the mosaic should be placed at the Reference Position: 0: Mosaic-Center, n=Panel-n
ref_action = ''                             # set to "update" to set reference position to current mount orientation; auto-resets to ""
ref = 0                                     # Defines Reference Frame: 0=Az/Alt/Roll, 1=RA/Dec/PA, 2=Glon/Glat/GPA
r1 = 90.0                                   # Axis1 of Reference Position
r2 = 5.0                                    # Axis2 of Reference Position
r3 = 0.0                                    # Axis3 of Reference Position
panel = 3                                   # Current panel number: 0=Mosaic-Center, n=Panel-n

[control]
advanced_control = true                    # Used to disable all advanced control features, must be true to use any advanced feature
advanced_kf = true                          # Enable the Kalman Filtering of measurement data to smooth out noise
advanced_rotator = true                     # Enable the ASCOM Alpaca Rotator API for frame rotation control (requires advanced_tracking)
advanced_slewing = true                     # Perform advanced control for move axis commands (no longer uses Benro Polaris tracking)
advanced_goto = true                        # Perform advanced goto slewing in Alpaca Driver (no longer uses Benro Polaris goto)
advanced_tracking = true                    # Perform advanced tracking of targets in Alpaca Driver (no longer uses Benro Polaris tracking)
advanced_pulse_guiding = true               # Enable the ASCOM Alpaca Pulse guiding API for applications like PHD2 (requires advanced_tracking)
advanced_pulse_pec_tuning = true            # Enable the ASCOM Alpaca Pulse guiding API for tuning of the PEC model
advanced_sync_guiding = false               # Enable the ASCOM Alpaca Pulse guiding API for applications like PHD2 (requires advanced_tracking)
advanced_alignment = false                  # Enable Multi-Point Alignment/Quest model vs Single Point Alignment/Polaris model
advanced_scc_enabled = true                 # Enable correction to reduce the number of Slew & Center cycles. Method defined by advanced_scc_choice
advanced_scc_choice = 2                     # 0 = Zero Last Residual, 1=Local Gausian Adjustment; 2=Sync Guiding Adjustment
advanced_align_mac = false                  # Enable Mechanical Alignment Correction models, corrects mechanical tilt on M3 and M2
advanced_orbitals = true                    # Enable Orbitals and non Sidereal Tracking rates
advanced_pec = false                        # Perform Periodic Error Correction Modelling
kf_measure_noise = [ 0.0031622776601683794, 0.00630957344480193,   0.01584893192461114,    0.001584893192461114,  0.0031622776601683794, 0.003981071705534973 ]
kf_process_noise = [ 5.011872336272725e-05, 7.943282347242822e-05, 0.00012589254117941674, 0.0001,                0.0001,                0.0001 ]
measurement_dt = 0.2                        # KF Polaris' microcontroller emits 518 position updates on this fixed hardware cadence (seconds)
measurement_catchup_max_dt = 2.0            # KF Maximum delay allowed before genuine 518 protocol outage flagging
pid_Kp = [1.0, 1.0, 1.0]                    # PID Proportional Gain for M1, M2, M3 - increase control in proportion to position deviation (error)
pid_Ki = [0.25, 0.25, 0.25]                 # PID Integral Gain for M1, M2, M3 - increase control when error is accumulating and persistent
pid_Kd = [0.5, 0.5, 0.8]                    # PID Derivative Gain for M1, M2, M3 - reduce control when angular velocity higher (damping)
pid_Ke = 0.4                                # PID Expotential Smoothing Gain for OP (0=None, 0.4=mix 40% of old OP)
pid_Kc = 0.75                               # PID Arc-minutes tollerance to accept as not deviating
pid_Ka = 0.0                                # PID Maximum acceleration (0.5 to 5.0 degress/s2) on any motor axis (use 0.0 to set default of 5) must be float
pid_Kv = 0.0                                # PID Maximum slew rate (0.0 to 8.5 degrees/s) on any motor axis (use 0.0 to set calibrated max) must be float
zeta_safety_margin = 10                     # Windup Prevention safety margin inside zeta limits
z1_min_limit = -270                         # Z1 Axis Raw Motor Control minimum in degrees
z1_max_limit = +270                         # Z1 Axis Raw Motor Control maximum in degrees
z2_min_limit = -55                          # z2 Axis Raw Motor Control minimum in degrees
z2_max_limit = +37                          # z2 Axis Raw Motor Control maximum in degrees
z3_min_limit = -270                         # Z3 Axis Raw Motor Control minimum in degrees
z3_max_limit = +270                         # Z3 Axis Raw Motor Control maximum in degrees
m1_park = 0.0                               # Motor 1 position for saved Park Location
m2_park = 0.0                               # Motor 2 position for saved Park Location
m3_park = 0.0                               # Motor 3 position for saved Park Location
guide_rate_ra = 1.0                         # Right Ascensiion guide rate multiple of sidereal rate
guide_rate_dec = 1.0                        # Declination guide rate multiple of sidereal rate


[models]
# Fitted parameters generated by fits_extract.py (copy to config.toml):
m3_tilt_dm1       =  -261.30                # [arcmin/fn_M3]  FAIR  R2=0.483
m3_tilt_dm2       =  -148.69                # [arcmin/fn_M3]  GOOD  R2=0.861
m3_tilt_dm3       =    +0.00                # [arcmin/fn_M3]  WEAK  R2=0.338
m2_tilt_dm2_amp   =   +94.78                # [arcmin/fn_M2]  FAIR  R2=0.499
m2_tilt_dm2_zero  =   +20.88                # [degrees     ]  FAIR  R2=0.499
m2_roll_coupling  =    +0.00                # [arcmin/fn_M2]  POOR  R2=0.013
m2_roll_zero      =    +0.00                # [degrees     ]  POOR  R2=0.013
m1_offset         =     0.0                 # [arcmin      ]
m2_offset         =     0.0                 # [arcmin      ]
m3_offset         =     0.0                 # [arcmin      ]


[device]
tracking_settle_time = 16                   # The time (in seconds) to wait after sidereal tracking is re-enabled, before marking the slew as complete.
aiming_adjustment_enabled = false           # Whether to make minor ajusttments to improve aiming.
aiming_adjustment_time = 2                  # The time (in seconds) in the future to convert from ra/dec to az/alt, to cater for sidereal tracking settle time.
aim_max_error_correction = 0.5              # The maximum angle (decimal degrees) that the driver will correct for when aiming at alzaz .
aiming_adjustment_az = -0.0300750663        # The initial az aiming adjustment (in decimal degrees), reset to 0 if you dont want any initial adjustment.
aiming_adjustment_alt = 0.0195474932        # The initial alt aiming adjustment (in decimal degrees), reset to 0 if you dont want any initial adjustment.

[logging]
log_dir = ''                                # Directory to store logs, '' is ../logs directory
log_level = 'INFO'                          # Default log level, show info and above messages.
log_to_file = true                          # log output to file alpaca.log, copying old logs to alpaca.1, ... alpaca.5
log_to_stdout = true                        # log output to stdout.

log_alpaca_protocol = true                  # log ASCOM Alpaca telescope protocol messages sent and received
log_rotator_protocol = true                 # log ASCOM Alpaca rotator protocol messages sent and received
log_alpaca_discovery = false                # log ASCOM Alpaca discovery and management protocol messages sent and received
log_synscan_protocol = true                 # log stellarium synscan and binary protocol messages sent and received
log_alpaca_actions = false                  # log ASCOM Alpaca action protocol messages (extensions to standard)
log_polaris_ble = false                     # log Benro Polaris Bluetooth Low Energy messages sent and received
log_polaris_protocol = false                # log Benro Polaris protocol messages sent and received
log_pulse_guiding = false                   # log ASCOM Alpaca pulse guiding protocol messages
log_alpaca_polling = false                  # log frequent polling messages from ASCOM Alpaca clients (eg Nina)
log_synscan_polling = false                 # log frequent polling messages from SynScan clients (eg Stellarium)
log_polaris_polling = false                 # log frequent polling messages from Benro Polaris
log_quest_model = true                      # log weights in multi-point sync model
log_orbital_queries = true                  # log information related to JPL and Celestrak orbital parameter queries
log_pec = true                              # log information related to Predictive Error Correction
log_heartbeat = false                       # log the stack track whenever there is a heartbeat skip
log_position = false                        # log full KF (KFLOG) and PID (PIDLOG) telemetry to file every control tick (~200ms while tracking)

max_size_mb = 10                            # maximum log file size.
num_keep_logs = 9                           # maximum number of log files to rotate through.
