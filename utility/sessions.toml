# Captured log sessions for the analysis notebooks (analyse_pec_delta, analyse_kf_pid, analyse_comms,
# analyse_pec_theta / analyse_pec_catalog via the catalog). Each notebook picks one with SESSION = "<key>".
#
# Add new logs: copy them into log_dir, then  uv run python utility/sessions.py --add-new  (appends stubs below
# without touching existing entries), and edit the notes. List them:  uv run python utility/sessions.py --list
#
# Fields: logs (names/globs in log_dir; rotated parts as "alpaca.x_a*.log"), phd2 (PHD2 guide log, optional),
# t_from / t_to (default analysis window, local time as in the log), date, driver, guiding, records
# (pec = PECLOG, sg = SGLOG, kf = KFLOG, pid = PIDLOG, sync = sync-guide residuals), notes.

[defaults]
log_dir = "../logs/archive"

