[project]
name = "alpaca-benro-polaris"
version = "2.2.0"
description = "Alpaca Driver and Pilot for the Benro Polaris"
authors = [
    { name = "David Morrison", email = "jdmorriso@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "bleak>=3.0.2",
    "certifi>=2026.7.22",
    "cryptography>=50.0.0",
    "ephem>=4.2.1",
    "falcon>=4.3.1",
    "idna>=3.19",
    "numpy>=2.5.2",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "starlette==1.3.1",
    "toml>=0.10.2",
    "urllib3>=2.7.0",
    "uvicorn>=0.52.4",
    "websockets>=17.0.1",
    "zeroconf>=0.150.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
driver = "alpaca_benro_polaris:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"
testpaths = ["tests"]
python_files = ["test_*.py"]